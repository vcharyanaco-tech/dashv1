<script>
const appState = {
  items: [],
  filtered: [],
  summary: {},
  analytics: {},
  audit: [],
  user: {},
  settings: {},
  isAdmin: false,
  isEditor: false,
  isViewer: false,
  darkMode: false,
  mustChange: false,
  editMode: 'edit'
};

function getAuthToken() {
  return window.localStorage.getItem('indiaPostAuthToken') || '';
}

function setAuthToken(token) {
  if (token) window.localStorage.setItem('indiaPostAuthToken', token);
  else window.localStorage.removeItem('indiaPostAuthToken');
}

function showScreen(screen) {
  ['login', 'forgot', 'reset'].forEach(name => {
    document.getElementById(name + 'Screen').classList.add('hidden');
  });
  document.getElementById(screen + 'Screen').classList.remove('hidden');
}

function showAuthMessage(elementId, message) {
  const el = document.getElementById(elementId);
  el.textContent = message || '';
  el.classList.toggle('hidden', !message);
}

function parseQueryParams() {
  const params = {};
  const query = window.location.search || '';
  if (!query) return params;
  query.substring(1).split('&').forEach(pair => {
    const parts = pair.split('=');
    const key = decodeURIComponent(parts[0] || '');
    if (key) params[key] = decodeURIComponent(parts[1] || '');
  });
  return params;
}

function isAuthError(message) {
  const msg = String(message || '');
  return msg.indexOf('Login required') !== -1 ||
    msg.indexOf('Session expired') !== -1 ||
    msg.indexOf('Please log in') !== -1;
}

function handleServerFailure(err) {
  hideOverlay();
  const msg = err && err.message ? err.message : String(err || 'Unknown error');
  if (isAuthError(msg)) {
    setAuthToken('');
    showScreen('login');
    return true;
  }
  return false;
}

function displayToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function renderLinkableText(value) {
  const text = value == null ? '' : String(value);
  if (!text) return '';
  const normalized = text.trim();
  if (!normalized) return '';
  const isUrl = /^(https?:\/\/|mailto:|ftp:\/\/|www\.)/i.test(normalized) || /(?:\.[a-z]{2,})(?:\/|$)/i.test(normalized);
  if (!isUrl) return escapeHtml(text);
  const href = /^www\./i.test(normalized) ? 'https://' + normalized : normalized;
  return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)}</a>`;
}

function showOverlay(message) {
  const overlay = document.getElementById('overlay');
  overlay.querySelector('.overlay-text').textContent = message || 'Working...';
  overlay.classList.remove('hidden');
}

function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

function openTab(tabId) {
  document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
  document.getElementById(tabId).classList.remove('hidden');
  document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');
  if (tabId === 'analytics') renderAnalytics();
  if (tabId === 'audit') renderAudit();
  if (tabId === 'reports') renderReportPreview();
  if (tabId === 'settings') renderSettings();
}

function setUserStatus(user) {
  const chip = document.getElementById('userChip');
  chip.textContent = user.loggedIn ? `${user.email} • ${user.role}` : 'Viewer mode';
  appState.user = user;
  appState.isAdmin = user.role === 'ADMIN';
  appState.isEditor = user.role === 'ADMIN' || user.role === 'EDITOR';
  appState.isViewer = ['ADMIN','EDITOR','VIEWER'].includes(user.role);
  document.getElementById('addButton').style.display = appState.isEditor ? 'inline-flex' : 'none';
  document.getElementById('logoutButton').classList.toggle('hidden', !user.loggedIn);
}

function initApp() {
  const params = parseQueryParams();
  const token = getAuthToken();

  if (params.resetToken && params.email) {
    document.getElementById('resetEmail').value = params.email;
    showScreen('reset');
    return;
  }

  if (!token) {
    showScreen('login');
    return;
  }

  loadApp();
}

function loadApp() {
  showOverlay('Loading app...');
  google.script.run.withSuccessHandler(data => {
    hideOverlay();
    if (!data || !data.user) {
      setAuthToken('');
      showScreen('login');
      return;
    }
    setUserStatus(data.user);
    appState.items = data.items || [];
    appState.summary = data.summary || {};
    appState.analytics = data.analytics || {};
    appState.audit = data.audit || [];
    appState.settings = data.settings || {};
    populateFilters();
    renderDashboard();
    applyTheme();
    showScreen('login');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('forgotScreen').classList.add('hidden');
    document.getElementById('resetScreen').classList.add('hidden');
    if (appState.mustChange) {
      document.getElementById('mustChangeBanner').classList.remove('hidden');
      openTab('settings');
      displayToast('Please set a new password to continue.');
    }
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    const message = err && err.message ? err.message : String(err || 'Unknown error');
    document.getElementById('messagePanel').classList.remove('hidden');
    document.getElementById('messagePanel').textContent = 'Error loading app: ' + message;
    console.error('App load failed', err);
  }).getAppData(getAuthToken());
}

function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  showOverlay('Logging in...');
  google.script.run.withSuccessHandler(res => {
    hideOverlay();
    if (!res || !res.success) {
      showAuthMessage('loginMessage', (res && res.message) || 'Login failed.');
      return;
    }
    setAuthToken(res.token);
    appState.mustChange = !!res.mustChange;
    showAuthMessage('loginMessage', '');
    loadApp();
  }).withFailureHandler(err => {
    hideOverlay();
    showAuthMessage('loginMessage', err && err.message ? err.message : 'Login failed.');
  }).login(email, password);
}

function handleForgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('forgotEmail').value.trim();
  showOverlay('Sending reset link...');
  google.script.run.withSuccessHandler(res => {
    hideOverlay();
    showAuthMessage('forgotMessage', (res && res.message) || 'Reset link sent.');
  }).withFailureHandler(err => {
    hideOverlay();
    showAuthMessage('forgotMessage', err && err.message ? err.message : 'Could not send reset link.');
  }).requestPasswordReset(email, window.location.href);
}

function handleResetPassword(e) {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value.trim();
  const np = document.getElementById('resetNewPassword').value;
  const cp = document.getElementById('resetConfirmPassword').value;
  const params = parseQueryParams();
  if (np !== cp) {
    showAuthMessage('resetMessage', 'Passwords do not match.');
    return;
  }
  showOverlay('Setting new password...');
  google.script.run.withSuccessHandler(res => {
    hideOverlay();
    if (!res || !res.success) {
      showAuthMessage('resetMessage', (res && res.message) || 'Could not reset password.');
      return;
    }
    setAuthToken(res.token);
    appState.mustChange = false;
    showAuthMessage('resetMessage', '');
    loadApp();
  }).withFailureHandler(err => {
    hideOverlay();
    showAuthMessage('resetMessage', err && err.message ? err.message : 'Could not reset password.');
  }).resetPasswordWithToken(email, params.resetToken, np);
}

function showForgotPassword() {
  showAuthMessage('forgotMessage', '');
  document.getElementById('forgotEmail').value = document.getElementById('loginEmail').value || '';
  showScreen('forgot');
}

function showLogin() {
  ['loginMessage', 'forgotMessage', 'resetMessage'].forEach(id => showAuthMessage(id, ''));
  showScreen('login');
}

function logout() {
  google.script.run.withSuccessHandler(() => {
    setAuthToken('');
    window.location.href = window.location.href.split('?')[0];
  }).withFailureHandler(() => {
    setAuthToken('');
    window.location.reload();
  }).logout(getAuthToken());
}

function applyTheme() {
  appState.darkMode = window.localStorage.getItem('indiaPostDarkMode') === 'true';
  document.body.classList.toggle('dark-mode', appState.darkMode);
  document.getElementById('themeToggle').textContent = appState.darkMode ? 'Light mode' : 'Dark mode';
}

function toggleDarkMode() {
  appState.darkMode = !appState.darkMode;
  window.localStorage.setItem('indiaPostDarkMode', String(appState.darkMode));
  applyTheme();
}

function populateFilters() {
  const filter = document.getElementById('sectorFilter');
  const selected = filter.value;
  const sectors = [...new Set(appState.items.map(item => item.sector).filter(Boolean))].sort();
  filter.innerHTML = `<option value="">All sectors</option>` + sectors.map(s => `<option value="${s}">${s}</option>`).join('');
  filter.value = selected;
}

function applyFilters() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const sector = document.getElementById('sectorFilter').value;
  appState.filtered = appState.items.filter(item => {
    const text = `${item.sector} ${item.description} ${item.action} ${item.responsibility}`.toLowerCase();
    return (!query || text.includes(query)) && (!sector || item.sector === sector);
  });
}

function renderDashboard() {
  applyFilters();
  const cards = appState.filtered.slice(0, 100).map(item => {
    const fieldsHtml = (item.displayFields || []).map(field => {
      const isHeaderRowValue = field && field.label && String(field.label).trim() !== '';
      const valueHtml = field.html
        ? `<div class="field-value preserve-whitespace field-html">${field.html}</div>`
        : `<div class="field-value preserve-whitespace">${escapeHtml(field.value)}</div>`;
      return `
        <div class="card-field ${isHeaderRowValue ? 'card-field-highlight' : ''}">
          <span class="field-label ${isHeaderRowValue ? 'field-label-highlight' : ''}">${escapeHtml(field.label || 'Value')}</span>
          ${valueHtml}
        </div>
      `;
    }).join('');

    return `
      <article class="card ${item.flagged ? 'flagged' : ''}">
        <div class="card-title preserve-whitespace"><strong>#${escapeHtml(item.id)}</strong></div>
        <div class="card-fields">${fieldsHtml || '<div class="card-field"><span class="field-label">Details</span><div class="field-value preserve-whitespace">No details available</div></div>'}</div>
        <div class="card-footer">
          <div class="actions">
            ${appState.isEditor ? `<button class="btn btn-secondary" onclick="editItem('${item.row}')">Edit</button>` : ''}
            ${appState.isEditor ? `<button class="btn btn-danger" onclick="deleteItem('${item.row}')">Delete</button>` : ''}
          </div>
        </div>
      </article>
    `;
  }).join('');
  document.getElementById('dashboardCards').innerHTML = cards || '<div class="message-panel">No records found.</div>';
  document.getElementById('summaryCards').innerHTML = `
    <div class="analytics-card"><h3>Total records</h3><p>${appState.summary.total || 0}</p></div>
    <div class="analytics-card"><h3>Review due</h3><p>${appState.summary.flagged || 0}</p></div>
    <div class="analytics-card"><h3>Open sectors</h3><p>${Object.keys(appState.summary.sectors || {}).length || 0}</p></div>
  `;
}

function renderAnalytics() {
  const cards = [
    { title: 'Total records', value: appState.summary.total || 0 },
    { title: 'Review due', value: appState.summary.flagged || 0 },
    { title: 'Normal items', value: appState.summary.normal || 0 }
  ].map(item => `<div class="analytics-card"><h3>${item.title}</h3><p>${item.value}</p></div>`).join('');
  document.getElementById('analyticsCards').innerHTML = cards;
  const sectors = Object.entries(appState.summary.sectors || {}).map(([sector, count]) => `<li>${escapeHtml(sector)}: ${count}</li>`).join('');
  document.getElementById('analyticsReport').innerHTML = `<div class="card"><h3>Records by sector</h3><ul>${sectors || '<li>No sector data</li>'}</ul></div>`;
}

function renderAudit() {
  const tbody = document.querySelector('#auditTable tbody');
  tbody.innerHTML = appState.audit.slice(0, 80).map(row => `
    <tr>
      <td class="preserve-whitespace">${escapeHtml(row.timestamp)}</td>
      <td class="preserve-whitespace">${escapeHtml(row.user)}</td>
      <td class="preserve-whitespace">${renderLinkableText(row.action)}</td>
      <td class="preserve-whitespace">${renderLinkableText(row.recordId)}</td>
      <td class="details-cell preserve-whitespace">${renderLinkableText(row.details)}</td>
    </tr>
  `).join('');
}

function renderReportPreview() {
  const itemsHtml = (appState.items || []).map(item => `
    <tr><td class="preserve-whitespace">${escapeHtml(item.id)}</td><td class="preserve-whitespace">${renderLinkableText(item.sector)}</td><td class="preserve-whitespace">${renderLinkableText(item.description)}</td><td class="preserve-whitespace">${item.actionHtml || renderLinkableText(item.action)}</td><td class="preserve-whitespace">${renderLinkableText(item.responsibility)}</td><td class="preserve-whitespace">${renderLinkableText(item.reviewDate)}</td></tr>`).join('');
  document.getElementById('reportPreview').innerHTML = `
    <div class="report-preview">
      <h3>Report preview</h3>
      <div class="report-preview-scroll">
        <table class="audit-table"><thead><tr><th>#</th><th>Sector</th><th>Description</th><th>Action</th><th>Responsibility</th><th>Review</th></tr></thead><tbody>${itemsHtml}</tbody></table>
      </div>
    </div>
  `;
}

function renderSettings() {
  document.getElementById('settingAppName').value = appState.settings.appName || 'India Post Dashboard';
  document.getElementById('settingSheetName').value = appState.settings.sheetName || 'Sheet1';
  document.getElementById('settingStartRow').value = appState.settings.startRow || 4;
  document.getElementById('mustChangeBanner').classList.toggle('hidden', !appState.mustChange);
  const usersAdmin = document.getElementById('usersAdmin');
  if (appState.isAdmin) {
    usersAdmin.classList.remove('hidden');
    loadUsers();
  } else {
    usersAdmin.classList.add('hidden');
  }
}

function loadUsers() {
  google.script.run.withSuccessHandler(users => {
    renderUsersTable(users || []);
  }).withFailureHandler(err => {
    if (handleServerFailure(err)) return;
    displayToast('Could not load users: ' + (err.message || err));
  }).adminGetUsers(getAuthToken());
}

function renderUsersTable(users) {
  const tbody = document.querySelector('#usersTable tbody');
  tbody.dataset.users = JSON.stringify(users);
  tbody.innerHTML = users.map((u, i) => `
    <tr>
      <td class="preserve-whitespace">${escapeHtml(u.email)}${u.mustChange ? ' <em>(must change)</em>' : ''}</td>
      <td>${escapeHtml(u.role)}</td>
      <td class="preserve-whitespace">${escapeHtml(u.createdAt || '')}</td>
      <td><button class="btn btn-secondary btn-small" data-action="reset" data-index="${i}">Reset password</button></td>
      <td><button class="btn btn-danger btn-small" data-action="delete" data-index="${i}">Delete</button></td>
    </tr>
  `).join('');
}

function handleAddUser(e) {
  e.preventDefault();
  if (!appState.isAdmin) { displayToast('Admin access required'); return; }
  const email = document.getElementById('newUserEmail').value.trim();
  const role = document.getElementById('newUserRole').value;
  const password = document.getElementById('newUserPassword').value;
  showOverlay('Adding user...');
  google.script.run.withSuccessHandler(users => {
    hideOverlay();
    document.getElementById('newUserEmail').value = '';
    document.getElementById('newUserPassword').value = '';
    document.getElementById('addUserStatus').textContent = 'User added';
    setTimeout(() => document.getElementById('addUserStatus').textContent = '', 3000);
    renderUsersTable(users || []);
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    document.getElementById('addUserStatus').textContent = err.message || 'Could not add user';
  }).adminAddUser(email, role, password, getAuthToken());
}

function deleteUser(email) {
  if (!confirm('Delete user ' + email + '?')) return;
  google.script.run.withSuccessHandler(users => {
    displayToast('User deleted');
    renderUsersTable(users || []);
  }).withFailureHandler(err => {
    if (handleServerFailure(err)) return;
    displayToast('Delete failed: ' + (err.message || err));
  }).adminDeleteUser(email, getAuthToken());
}

function resetUserPassword(email) {
  const newPassword = prompt('New password for ' + email + ' (min 8 characters):');
  if (!newPassword) return;
  google.script.run.withSuccessHandler(users => {
    displayToast('Password reset for ' + email);
    renderUsersTable(users || []);
  }).withFailureHandler(err => {
    if (handleServerFailure(err)) return;
    displayToast('Reset failed: ' + (err.message || err));
  }).adminResetPassword(email, newPassword, getAuthToken());
}

function handleChangePassword(e) {
  e.preventDefault();
  const current = document.getElementById('changeCurrentPassword').value;
  const np = document.getElementById('changeNewPassword').value;
  const cp = document.getElementById('changeConfirmPassword').value;
  if (np !== cp) {
    document.getElementById('changePasswordStatus').textContent = 'Passwords do not match';
    return;
  }
  showOverlay('Updating password...');
  google.script.run.withSuccessHandler(res => {
    hideOverlay();
    const status = document.getElementById('changePasswordStatus');
    status.textContent = (res && res.message) || 'Password updated';
    setTimeout(() => status.textContent = '', 3000);
    if (res && res.success) {
      document.getElementById('changeCurrentPassword').value = '';
      document.getElementById('changeNewPassword').value = '';
      document.getElementById('changeConfirmPassword').value = '';
      appState.mustChange = false;
      document.getElementById('mustChangeBanner').classList.add('hidden');
      displayToast('Password updated');
    }
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    document.getElementById('changePasswordStatus').textContent = err.message || 'Could not update password';
  }).changePassword(current, np, getAuthToken());
}

function refreshData() {
  showOverlay('Refreshing data...');
  google.script.run.withSuccessHandler(data => {
    hideOverlay();
    appState.items = data.items || [];
    appState.summary = data.summary || {};
    appState.analytics = data.analytics || {};
    appState.audit = data.audit || [];
    populateFilters();
    renderDashboard();
    displayToast('Dashboard refreshed');
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('Refresh failed: ' + (err.message || err));
  }).getAppData(getAuthToken());
}

function addNewItem() {
  if (!appState.isEditor) { displayToast('Admin/editor access required'); return; }
  appState.editMode = 'add';
  document.getElementById('editRow').value = '';
  document.getElementById('editId').value = '';
  document.getElementById('editSector').value = '';
  document.getElementById('editDescription').value = '';
  document.getElementById('editEntryDate').value = '';
  document.getElementById('editAction').value = '';
  document.getElementById('editResponsibility').value = '';
  document.getElementById('editReviewDate').value = '';
  document.getElementById('editFlagged').checked = false;
  document.getElementById('editStatus').textContent = '';
  document.getElementById('editModal').classList.remove('hidden');
}

function editItem(row) {
  const item = appState.items.find(i => String(i.row) === String(row));
  if (!item) return;
  appState.editMode = 'edit';
  document.getElementById('editRow').value = item.row;
  document.getElementById('editId').value = item.id || '';
  document.getElementById('editSector').value = item.sector || '';
  document.getElementById('editDescription').value = item.description || '';
  document.getElementById('editEntryDate').value = item.entryDate || '';
  document.getElementById('editAction').value = item.action || '';
  document.getElementById('editResponsibility').value = item.responsibility || '';
  document.getElementById('editReviewDate').value = item.reviewDate || '';
  document.getElementById('editFlagged').checked = !!item.flagged;
  document.getElementById('editStatus').textContent = '';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveEditModal(e) {
  e.preventDefault();
  if (!appState.isEditor) { displayToast('Admin/editor access required'); return; }
  const item = {
    row: Number(document.getElementById('editRow').value || 0),
    id: document.getElementById('editId').value,
    sector: document.getElementById('editSector').value.trim(),
    description: document.getElementById('editDescription').value,
    entryDate: document.getElementById('editEntryDate').value.trim(),
    action: document.getElementById('editAction').value,
    responsibility: document.getElementById('editResponsibility').value.trim(),
    reviewDate: document.getElementById('editReviewDate').value.trim(),
    flagged: document.getElementById('editFlagged').checked
  };
  if (appState.editMode === 'add') {
    submitNewItem(item);
  } else if (item.row) {
    saveItem(item);
  }
}

function submitNewItem(item) {
  showOverlay('Adding record...');
  google.script.run.withSuccessHandler(data => {
    hideOverlay();
    closeEditModal();
    appState.items = data.items || [];
    appState.summary = data.summary || {};
    populateFilters();
    renderDashboard();
    displayToast('New item created');
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('Add failed: ' + (err.message || err));
  }).addItem(item, getAuthToken());
}

function saveItem(item) {
  if (!appState.isEditor) { displayToast('Admin/editor access required'); return; }
  showOverlay('Saving record...');
  google.script.run.withSuccessHandler(data => {
    hideOverlay();
    closeEditModal();
    appState.items = data.items || [];
    appState.summary = data.summary || {};
    renderDashboard();
    displayToast('Record saved');
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('Save failed: ' + (err.message || err));
  }).updateItem(item, getAuthToken());
}

function deleteItem(row) {
  if (!appState.isEditor) { displayToast('Admin/editor access required'); return; }
  if (!confirm('Delete this record permanently?')) return;
  showOverlay('Deleting record...');
  google.script.run.withSuccessHandler(data => {
    hideOverlay();
    appState.items = data.items || [];
    appState.summary = data.summary || {};
    renderDashboard();
    displayToast('Record deleted');
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('Delete failed: ' + (err.message || err));
  }).deleteItem(row, getAuthToken());
}

function downloadFromBase64(base64, filename, mimeType) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: mimeType || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename || 'IndiaPostDashboard_Report';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function exportSpreadsheet() {
  showOverlay('Exporting Excel file...');
  google.script.run.withSuccessHandler(result => {
    hideOverlay();
    if (result && result.base64) {
      downloadFromBase64(result.base64, result.filename || 'IndiaPostDashboard_Report.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      displayToast('Excel file downloaded');
    } else {
      displayToast('Excel export failed');
    }
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('Excel export failed: ' + (err.message || err));
  }).exportToSpreadsheet(getAuthToken());
}

function downloadPdf() {
  showOverlay('Generating PDF...');
  google.script.run.withSuccessHandler(result => {
    hideOverlay();
    if (result && result.base64) {
      downloadFromBase64(result.base64, result.filename || 'IndiaPostDashboard_Report.pdf', 'application/pdf');
      displayToast('PDF downloaded');
    } else {
      displayToast('PDF export failed');
    }
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('PDF export failed: ' + (err.message || err));
  }).createPdfReport(getAuthToken());
}

function printReport() {
  window.print();
}

function saveSettings(e) {
  e.preventDefault();
  if (!appState.isAdmin) { displayToast('Admin access required'); return; }
  const settings = {
    appName: document.getElementById('settingAppName').value || 'India Post Dashboard',
    sheetName: document.getElementById('settingSheetName').value || 'Sheet1',
    startRow: Number(document.getElementById('settingStartRow').value) || 4
  };
  showOverlay('Saving settings...');
  google.script.run.withSuccessHandler(result => {
    hideOverlay();
    document.getElementById('settingsStatus').textContent = 'Saved successfully';
    setTimeout(() => document.getElementById('settingsStatus').textContent = '', 3000);
    displayToast('Settings saved');
  }).withFailureHandler(err => {
    hideOverlay();
    if (handleServerFailure(err)) return;
    displayToast('Could not save settings: ' + (err.message || err));
  }).saveAppSettings(settings, getAuthToken());
}

function escapeHtml(value) {
  if (value === undefined || value === null) return '';
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

document.getElementById('usersTable').addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const users = JSON.parse(document.getElementById('usersTable').dataset.users || '[]');
  const user = users[Number(btn.dataset.index)];
  if (!user) return;
  if (btn.dataset.action === 'delete') deleteUser(user.email);
  else if (btn.dataset.action === 'reset') resetUserPassword(user.email);
});

window.addEventListener('load', initApp);
</script>
