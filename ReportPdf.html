<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>India Post Dashboard Report</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; color: #111; }
    h1,h2,h3 { margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th,td { border: 1px solid #aaa; padding: 8px; font-size: 12px; }
    th { background: #f2f2f2; }
    .header-row { margin-bottom: 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .summary-card { padding: 12px; border: 1px solid #ccc; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>India Post Dashboard</h1>
  <div class="header-row"><strong>Generated:</strong> <?= Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'dd MMM yyyy HH:mm') ?></div>
  <div class="summary-grid">
    <div class="summary-card"><strong>Total records</strong><div><?= data.summary.total || 0 ?></div></div>
    <div class="summary-card"><strong>Review due</strong><div><?= data.summary.flagged || 0 ?></div></div>
    <div class="summary-card"><strong>Sectors</strong><div><?= Object.keys(data.summary.sectors || {}).length ?></div></div>
  </div>
  <h2>Items</h2>
  <table>
    <thead><tr><th>#</th><th>Sector</th><th>Description</th><th>Action</th><th>Responsibility</th><th>Review</th></tr></thead>
    <tbody>
      <? for (var i = 0; i < (data.items || []).length; i++) { var item = data.items[i]; ?>
      <tr>
        <td><?= item.id ?></td>
        <td><?= item.sector ?></td>
        <td><?= item.description ?></td>
        <td><?= item.action ?></td>
        <td><?= item.responsibility ?></td>
        <td><?= item.reviewDate ?></td>
      </tr>
      <? } ?>
    </tbody>
  </table>
</body>
</html>
