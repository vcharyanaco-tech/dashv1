<style>
/* ==========================================================================
   India Post Dashboard — Design System
   ==========================================================================
   Tokens, typography, spacing, layout, and every component.
   8px spacing scale · Inter typography · enterprise palette · dark mode.
   ========================================================================== */

/* ---------------------------------- Tokens ---------------------------------- */
:root {
  color-scheme: light;

  /* Brand */
  --primary: #da291c;
  --primary-hover: #b92317;
  --primary-soft: #fdeceb;
  --secondary: #004b87;
  --secondary-hover: #003c6d;
  --secondary-soft: #e7f0f8;
  --accent: #004b87;

  /* Neutrals */
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --surface-3: #f1f3f5;
  --text: #1d2129;
  --text-strong: #0f1115;
  --muted: #667085;
  --border: #e4e7ec;
  --border-strong: #d0d5dd;

  /* Semantic */
  --success: #15803d;
  --success-soft: #e7f5ec;
  --warning: #b45309;
  --warning-soft: #fdf3e0;
  --danger: #b91c1c;
  --danger-soft: #fdeaea;
  --info: #0369a1;
  --info-soft: #e3f1fa;

  /* Feedback */
  --focus-ring: rgba(0, 75, 135, .35);
  --overlay: rgba(15, 23, 42, .55);

  /* Typography */
  --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --fs-display: 30px;
  --fs-heading: 22px;
  --fs-subheading: 16px;
  --fs-body: 14px;
  --fs-caption: 12px;
  --lh-tight: 1.25;
  --lh-normal: 1.5;

  /* Spacing (8px scale) */
  --sp-0-5: 4px;
  --sp-1: 8px;
  --sp-2: 16px;
  --sp-3: 24px;
  --sp-4: 32px;
  --sp-5: 40px;
  --sp-6: 48px;

  /* Radii */
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --radius-pill: 999px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-sm: 0 2px 8px rgba(16, 24, 40, .06);
  --shadow-md: 0 6px 20px rgba(16, 24, 40, .09);
  --shadow-lg: 0 16px 48px rgba(16, 24, 40, .16);

  /* Layout */
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 80px;
  --topbar-h: 64px;
  --content-max: 1440px;

  --transition: 200ms cubic-bezier(.4, 0, .2, 1);
}

body.dark-mode {
  color-scheme: dark;

  --primary: #e55a4e;
  --primary-hover: #ef7266;
  --primary-soft: rgba(229, 90, 78, .16);
  --secondary: #4a8fd1;
  --secondary-hover: #63a3de;
  --secondary-soft: rgba(74, 143, 209, .16);
  --accent: #90caf9;

  --bg: #0e1116;
  --surface: #161a21;
  --surface-2: #1b202a;
  --surface-3: #232936;
  --text: #e6e8ec;
  --text-strong: #f4f6f9;
  --muted: #9aa3af;
  --border: #2a303b;
  --border-strong: #3a424f;

  --success: #34d399;
  --success-soft: rgba(52, 211, 153, .14);
  --warning: #fbbf24;
  --warning-soft: rgba(251, 191, 36, .14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, .14);
  --info: #38bdf8;
  --info-soft: rgba(56, 189, 248, .14);

  --focus-ring: rgba(144, 202, 249, .45);
  --overlay: rgba(2, 6, 12, .66);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, .4);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, .45);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, .55);
}

/* ---------------------------------- Base ---------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { font-size: 14px; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-normal);
  color: var(--text);
  background: var(--bg);
  transition: background var(--transition), color var(--transition);
}

button, input, select, textarea { font: inherit; }

a { color: var(--accent); }

img { max-width: 100%; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}

.hidden { display: none !important; }
.preserve-whitespace { white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); }

/* Typography scale */
.text-heading { font-size: var(--fs-heading); font-weight: 700; line-height: var(--lh-tight); letter-spacing: -.01em; }
.text-subheading { font-size: var(--fs-subheading); font-weight: 600; line-height: var(--lh-tight); }

/* ---------------------------------- App shell ---------------------------------- */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
  max-width: var(--content-max);
  margin: 0 auto;
  transition: grid-template-columns var(--transition);
}

body.sidebar-collapsed .app-shell { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

/* ---------------------------------- Sidebar ---------------------------------- */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
  z-index: 40;
  transition: width var(--transition), transform var(--transition);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  min-height: var(--topbar-h);
  border-bottom: 1px solid var(--border);
}

.brand-mark {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--primary);
  font-size: 20px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  padding: 5px;
}

.brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-mark svg { width: 100%; height: 100%; display: block; }
.brand-mark-fallback { display: none; font-size: 24px; line-height: 1; }

.brand-text { min-width: 0; }
.brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
.brand-subtitle { font-size: var(--fs-caption); color: var(--muted); font-weight: 500; }

.sidebar-collapse { margin-left: auto; }
body.sidebar-collapsed .sidebar-collapse svg { transform: rotate(180deg); }
body.sidebar-collapsed .sidebar-collapse { margin-left: 0; align-self: center; }

.sidebar-section-label {
  padding: var(--sp-3) var(--sp-2) var(--sp-1);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: var(--sp-0-5);
  padding: 0 var(--sp-1) var(--sp-2);
  flex: 1 1 auto;
  overflow-y: auto;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  padding: 11px 12px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text);
  font-size: var(--fs-body);
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: background var(--transition), color var(--transition), transform var(--transition);
}

.nav-item svg { flex: 0 0 auto; }

.nav-item:hover { background: var(--surface-3); }

.nav-item.active {
  background: var(--secondary-soft);
  color: var(--secondary);
  box-shadow: inset 3px 0 0 var(--secondary);
}

.nav-item.active svg { stroke-width: 2.4; }

body.sidebar-collapsed .nav-item { justify-content: center; padding: 11px 0; }
body.sidebar-collapsed .nav-item span,
body.sidebar-collapsed .sidebar-section-label,
body.sidebar-collapsed .brand-text,
body.sidebar-collapsed .sidebar-footer .version-chip span { display: none; }
body.sidebar-collapsed .sidebar-credit { display: none; }
body.sidebar-collapsed .sidebar-brand { justify-content: center; padding: var(--sp-2) var(--sp-1); }
body.sidebar-collapsed .nav-item.active { box-shadow: inset 0 0 0 2px var(--secondary); }

.sidebar-footer {
  padding: var(--sp-2);
  border-top: 1px solid var(--border);
}

.sidebar-credit {
  margin-top: 8px;
  font-size: 11px;
  line-height: 1.4;
  color: var(--muted);
}

.version-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
  color: var(--muted);
  font-size: var(--fs-caption);
  font-weight: 600;
}

/* ---------------------------------- Main column ---------------------------------- */
.app-main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  min-height: var(--topbar-h);
  padding: 0 var(--sp-3);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.topbar-left { display: flex; align-items: center; gap: var(--sp-2); flex: 1 1 auto; min-width: 0; }

.topbar-search {
  position: relative;
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  max-width: 460px;
  min-width: 160px;
}

.topbar-search svg { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }

.topbar-search input {
  width: 100%;
  padding: 9px 12px 9px 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}

.topbar-search input:focus {
  outline: none;
  border-color: var(--focus-ring);
  box-shadow: 0 0 0 4px var(--secondary-soft);
  background: var(--surface);
}

.search-kbd {
  position: absolute;
  right: 10px;
  padding: 2px 7px;
  border: 1px solid var(--border);
  border-bottom-color: var(--border-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  pointer-events: none;
}

.topbar-actions { display: flex; align-items: center; gap: var(--sp-1); }

.live-clock {
  flex-shrink: 0;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  line-height: 1;
  white-space: nowrap;
  user-select: none;
}

/* Date picker popup */
.date-field { position: relative; }

.datepicker-popup {
  position: absolute;
  left: 0;
  z-index: 100;
  width: 252px;
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  animation: fade-in var(--transition);
}

.datepicker-popup.hidden { display: none; }

.dp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-1);
  margin-bottom: var(--sp-1);
}

.dp-title { font-weight: 700; font-size: 14px; }

.dp-nav {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}

.dp-nav:hover { border-color: var(--primary); color: var(--primary); }

.dp-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 4px;
}

.dp-weekdays span {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  padding: 4px 0;
}

.dp-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.dp-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 30px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}

.dp-cell:hover { background: var(--surface-2); }

.dp-cell.dp-today { border-color: var(--primary); color: var(--primary); font-weight: 700; }

.dp-cell.dp-selected { background: var(--primary); border-color: var(--primary); color: #fff; }

.dp-blank { cursor: default; }

.dp-foot {
  display: flex;
  gap: var(--sp-1);
  margin-top: var(--sp-1);
  padding-top: var(--sp-1);
  border-top: 1px solid var(--border);
}

.dp-btn {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.dp-btn:hover { border-color: var(--primary); color: var(--primary); }

.dp-btn.dp-clear { color: var(--danger); }
.dp-btn.dp-clear:hover { border-color: var(--danger); }

/* Icon button */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}

.icon-btn:hover { background: var(--surface-3); }
.icon-btn.active { background: var(--secondary-soft); color: var(--secondary); }

/* ---------------------------------- Notifications ---------------------------------- */
.notif-menu { position: relative; }

.notif-bell { position: relative; }

.notif-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--radius-pill);
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
  box-shadow: 0 0 0 2px var(--surface);
}

.notif-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 60;
  width: 340px;
  max-width: calc(100vw - 24px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.notif-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.notif-panel-head .text-subheading { margin: 0; }

.notif-list {
  list-style: none;
  margin: 0;
  padding: 4px;
  max-height: 380px;
  overflow-y: auto;
}

.notif-item {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: background var(--transition);
}

.notif-item:hover { background: var(--surface-3); }

.notif-item-unread {
  background: var(--secondary-soft);
}

.notif-item-unread:hover { background: var(--secondary-soft); }

.notif-item-title { font-size: 13px; font-weight: 700; }

.notif-item-body {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.notif-item-time {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.notif-item-empty {
  padding: 14px 12px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

.notif-empty {
  padding: 14px 12px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

/* ---------------------------------- Profile menu ---------------------------------- */
.profile-menu { position: relative; }

.profile-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 6px 6px;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}

.profile-trigger:hover { background: var(--surface-3); border-color: var(--border); }

.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-pill);
  background: var(--secondary);
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
}

.profile-info { display: flex; flex-direction: column; line-height: 1.15; text-align: left; min-width: 0; }
.profile-name { font-size: 13px; font-weight: 700; }
.profile-role { font-size: 11px; color: var(--muted); }

.profile-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 60;
  min-width: 220px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
}

.profile-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }

.profile-dropdown-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}

.profile-dropdown-email { font-size: 13px; font-weight: 700; word-break: break-all; }

.profile-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: background var(--transition);
}

.profile-item:hover { background: var(--surface-3); }
.profile-item.danger { color: var(--danger); }

/* ---------------------------------- Main content ---------------------------------- */
.main-content {
  flex: 1 1 auto;
  padding: var(--sp-3);
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
}

.section-header {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-2);
  align-items: flex-start;
  margin-bottom: var(--sp-3);
  flex-wrap: wrap;
}

.section-header h2, .section-header h3 { margin: 0 0 4px; }

.section-copy { margin: 0; color: var(--muted); font-size: 13px; }

.section-actions { display: flex; gap: var(--sp-1); flex-wrap: wrap; }

.app-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: var(--sp-2) var(--sp-3) var(--sp-3);
  color: var(--muted);
  font-size: var(--fs-caption);
  border-top: 1px solid var(--border);
}

.footer-brand-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  flex-wrap: wrap;
}

.footer-title {
  font-weight: 800;
  letter-spacing: .01em;
  background: linear-gradient(90deg, var(--secondary), var(--primary));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.footer-version {
  font-weight: 700;
  padding: 2px 10px;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--primary) 14%, transparent);
  color: var(--primary);
}

.footer-credit {
  font-size: 12px;
  color: var(--muted);
}

.footer-credit-org {
  font-weight: 700;
  color: #c9861f;
}

.footer-dot { opacity: .4; }

/* ---------------------------------- Buttons ---------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: var(--fs-body);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
}

.btn:active { transform: translateY(1px) scale(.99); }

.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-sm); }

.btn-secondary { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover { background: var(--surface-3); }

.btn-ghost { background: transparent; color: var(--text); }
.btn-ghost:hover { background: var(--surface-3); }

.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(.94); box-shadow: var(--shadow-sm); }

.btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }
.btn:disabled:hover { filter: none; box-shadow: none; }

.btn-link {
  border: none;
  background: transparent;
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-xs);
}
.btn-link:hover { text-decoration: underline; }

.btn-small { padding: 7px 12px; font-size: 13px; border-radius: var(--radius-sm); }
.btn-block { width: 100%; }
.btn[disabled], .btn.disabled { opacity: .55; cursor: not-allowed; }

/* ---------------------------------- Forms ---------------------------------- */
.form { display: grid; gap: var(--sp-2); }

.form-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.form-status { color: var(--muted); font-size: 13px; }
.form-status.success { color: var(--success); font-weight: 600; }
.form-status.error { color: var(--danger); font-weight: 600; }

.field { display: grid; gap: 6px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--text); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }

.field-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field-label-row > label { font-size: 13px; font-weight: 600; color: var(--text); }
.field-link-btn {
  appearance: none;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color var(--transition), color var(--transition), background var(--transition);
}
.field-link-btn:hover { color: var(--text); border-color: var(--text-muted); }
.field-link-btn.is-linked { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.field-hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
}

.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--focus-ring);
  box-shadow: 0 0 0 4px var(--secondary-soft);
}

.input[readonly] { background: var(--surface-3); color: var(--muted); cursor: default; }

.textarea { resize: vertical; min-height: 76px; line-height: var(--lh-normal); }

.field.invalid .input,
.field.invalid .select,
.field.invalid .textarea { border-color: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }

.field-error { display: none; font-size: var(--fs-caption); color: var(--danger); font-weight: 500; }
.field.invalid .field-error { display: block; }

.checkbox {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.checkbox input { width: 16px; height: 16px; accent-color: var(--primary); }

/* ---------------------------------- Badges ---------------------------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .3px;
  text-transform: uppercase;
  line-height: 1.5;
}

.badge[data-tone="success"] { background: var(--success-soft); color: var(--success); }
.badge[data-tone="warning"] { background: var(--warning-soft); color: var(--warning); }
.badge[data-tone="danger"] { background: var(--danger-soft); color: var(--danger); }
.badge[data-tone="muted"] { background: var(--surface-3); color: var(--muted); }

/* ---------------------------------- Banners ---------------------------------- */
.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  margin-bottom: var(--sp-2);
  font-size: 13px;
  font-weight: 500;
}

.banner-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 25%, transparent); color: var(--info); }
.banner-warning { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 30%, transparent); color: var(--warning); }
.banner-danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, transparent); color: var(--danger); }

.reminder-banner {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  margin-bottom: var(--sp-2);
  border-radius: var(--radius-md);
  border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent);
  background: var(--warning-soft);
  color: var(--warning);
  font-size: 13px;
}
.reminder-banner-title { font-weight: 700; flex-shrink: 0; }
.reminder-banner-list { display: grid; gap: 4px; min-width: 0; }
.reminder-banner-list .reminder-item { line-height: 1.45; }
.reminder-banner-list .reminder-item strong { color: var(--text); }
.reminder-banner-close { margin-left: auto; flex-shrink: 0; color: inherit; }

/* ---------------------------------- KPI cards ---------------------------------- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.kpi-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}

.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--border-strong); }

.kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-1); }

.kpi-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  color: #fff;
}

.kpi-icon.tone-secondary { background: var(--secondary); }
.kpi-icon.tone-success { background: var(--success); }
.kpi-icon.tone-warning { background: var(--warning); }

.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 700;
}
.kpi-trend.up { background: var(--success-soft); color: var(--success); }
.kpi-trend.down { background: var(--danger-soft); color: var(--danger); }
.kpi-trend.flat { background: var(--surface-3); color: var(--muted); }

.kpi-label { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.kpi-value { font-size: var(--fs-display); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--text-strong); }
.kpi-subtitle { font-size: var(--fs-caption); color: var(--muted); }

.kpi-sparkline { width: 100%; height: 40px; margin-top: 4px; }
.kpi-sparkline svg { width: 100%; height: 100%; display: block; }

.kpi-skeleton { min-height: 132px; gap: var(--sp-1); }

/* ---------------------------------- Skeleton ---------------------------------- */
.skeleton-bar {
  display: block;
  height: 14px;
  border-radius: var(--radius-xs);
  background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 50%, var(--surface-3) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease infinite;
}

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ---------------------------------- Data cards ---------------------------------- */
.cards-grid { display: grid; grid-template-columns: 1fr; gap: var(--sp-2); }

/* Optimistic task-complete feedback: dims the row and shows a sweep shimmer
   while the server round-trip is in flight. Removed on success / rollback. */
.task-pending { opacity: .6; pointer-events: none; position: relative; }
.task-pending::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  background-size: 200% 100%;
  animation: taskSweep 1.1s ease-in-out infinite;
}
@keyframes taskSweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Lazy-render sentinel: the IntersectionObserver watches this 1px spacer. */
.cards-sentinel { height: 1px; width: 100%; }

/* Skip layout/paint for off-screen table rows (Chrome/Firefox). */
#dashboardTable tbody tr { content-visibility: auto; contain-intrinsic-size: auto 42px; }

.card {
  position: relative;
  display: grid;
  gap: var(--sp-2);
  min-width: 0;
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}

.card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

.card.review-due { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 45%, transparent); }

.card-title { display: flex; align-items: center; }

.id-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 14px;
  border-radius: var(--radius-pill);
  background: var(--secondary-soft);
  border: 1px solid color-mix(in srgb, var(--secondary) 25%, transparent);
  color: var(--secondary);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .3px;
}

.card-fields { display: grid; gap: var(--sp-1); }

.card-field {
  display: grid;
  gap: 6px;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius-md);
  background: var(--surface-2);
  border: 1px solid transparent;
}

.card-field-highlight {
  background: var(--secondary-soft);
  border-color: color-mix(in srgb, var(--secondary) 22%, transparent);
}

.field-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--muted);
}

.field-label-highlight { color: var(--secondary); }

.field-value { color: var(--text); line-height: var(--lh-normal); }

.field-html a { color: var(--accent); text-decoration: underline; }

.card h3 { margin: 0; }

.card .actions { display: flex; gap: var(--sp-1); flex-wrap: wrap; align-items: center; }

/* Per-record AI insight panel (cards + table rows) */
.card-ai-panel {
  margin-top: var(--sp-2);
  padding: var(--sp-2);
  border-radius: var(--radius-md);
  background: var(--surface-2);
  border: 1px solid var(--border);
  min-width: 0;
  overflow: hidden;
}
.card-ai-collapsed { display: none; }
.card-ai-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: var(--sp-1);
}
.card-ai-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--accent);
}
.card-ai-body { display: grid; gap: 8px; min-width: 0; }
.card-ai-loading { font-size: 13px; color: var(--muted); }
.card-ai-error { font-size: 13px; color: var(--danger); }
.card-ai-link { margin-top: 6px; }
.card-ai-link-result { display: grid; gap: 8px; }
.card-ai-link-label { font-size: 12px; color: var(--muted); word-break: break-all; }
.card-ai-size { font-weight: 700; color: var(--accent); white-space: nowrap; }
.card-ai-preview { margin-top: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.card-ai-preview summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.card-ai-preview-text {
  margin-top: 6px;
  max-height: 180px;
  overflow-y: auto;
  padding: var(--sp-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  background: var(--surface-2);
  white-space: pre-wrap;
  word-break: break-word;
}
.card-ai-table-title {
  margin-top: 6px;
  padding: 8px 12px;
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-xs);
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-ai-table-wrap {
  margin-top: 6px;
  max-height: 380px;
  max-width: 100%;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 6px 16px rgba(15, 23, 42, .06);
}
.card-ai-table {
  border-collapse: separate;
  border-spacing: 0 4px;
  font-size: 12px;
  min-width: 100%;
  color: var(--text);
}
.card-ai-table th,
.card-ai-table td {
  padding: 8px 12px;
  text-align: left;
  white-space: nowrap;
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: top;
}
.card-ai-table thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
}
.card-ai-table thead th:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.card-ai-table thead th:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.card-ai-table tbody td { background: var(--surface); }
.card-ai-table tbody tr:nth-child(even) td {
  background: color-mix(in srgb, var(--accent) 4%, var(--surface));
}
.card-ai-table tbody tr:hover td {
  background: color-mix(in srgb, var(--accent) 10%, var(--surface));
}
.card-ai-table tbody td:first-child {
  font-weight: 600;
  color: var(--accent);
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  box-shadow: inset 3px 0 0 var(--accent);
}
.card-ai-table tbody td:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.card-ai-table-note {
  margin-top: 8px;
  padding: 6px 10px;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface-3);
  border-radius: var(--radius-xs);
  display: inline-block;
}
.meeting-notes-hint {
  margin: 0 0 var(--sp-2);
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-xs);
}
.meeting-notes-wrap { display: grid; gap: 14px; margin-top: 4px; }
.meeting-notes-section p {
  margin: 0;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.meeting-notes-list {
  margin: 0;
  padding-left: 18px;
  display: grid;
  gap: 6px;
}
.meeting-notes-list li {
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
}
.meeting-notes-table { max-width: 100%; }
.meeting-notes-table tbody td { white-space: normal; }
.meeting-priority {
  display: inline-block;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  border-radius: 999px;
  text-transform: uppercase;
  background: var(--surface-3);
  color: var(--muted);
}
.meeting-priority[data-priority="HIGH"] { background: color-mix(in srgb, var(--warning) 22%, var(--surface)); color: var(--warning); }
.meeting-priority[data-priority="URGENT"] { background: color-mix(in srgb, var(--danger) 18%, var(--surface)); color: var(--danger); }
.meeting-notes-transcript pre {
  margin: 0;
  padding: 10px 12px;
  max-height: 260px;
  overflow: auto;
  font-family: var(--font-mono, ui-monospace, Consolas, monospace);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
}
.meeting-notes-error {
  padding: 10px 12px;
  font-size: 13px;
  color: var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, var(--surface));
  border-left: 3px solid var(--danger);
  border-radius: var(--radius-xs);
}
.fathom-meeting-list {
  display: grid;
  gap: 8px;
  margin-top: 6px;
}
.fathom-meeting-item {
  display: grid;
  gap: 4px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.fathom-meeting-item:hover,
.fathom-meeting-item:focus-visible {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface-2));
}
.fathom-meeting-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}
.fathom-meeting-meta {
  font-size: 12px;
  color: var(--muted);
}
.fathom-meeting-summary {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.meeting-rec-box {
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  border-radius: var(--radius-xs);
}
.meeting-rec-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.meeting-rec-head .btn { display: inline-flex; align-items: center; gap: 6px; }
.meeting-rec-timer {
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 700;
  color: var(--danger);
}
.meeting-rec-status {
  font-size: 12px;
  color: var(--muted);
  min-height: 16px;
}
.meeting-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0 8px;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.meeting-divider::before,
.meeting-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.meeting-notes-drive {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
}
.meeting-notes-drive a { color: var(--accent); text-decoration: none; }
.meeting-notes-drive a:hover { text-decoration: underline; }
.meeting-rec-float {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 1490;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1px solid var(--danger);
  border-radius: 999px;
  background: var(--surface);
  color: var(--danger);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  animation: slide-up var(--transition);
}
.meeting-rec-float-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--danger);
  animation: rec-dot-pulse 1.2s ease-in-out infinite;
}
@keyframes rec-dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .35; transform: scale(.75); }
}
.meeting-rec-float:hover { background: var(--danger); color: #fff; }
.meeting-rec-float:hover .meeting-rec-float-dot { background: #fff; }
.ai-insight-tr > td,
.ai-link-tr > td { border: none; padding: var(--sp-1) var(--sp-2) var(--sp-2); }

/* Review badges (top-right) */
.review-badge {
  position: absolute;
  top: var(--sp-2);
  right: var(--sp-2);
  z-index: 5;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: var(--fs-caption);
  font-weight: 700;
  letter-spacing: .3px;
}

.review-due.review-badge { background: var(--warning); color: #fff; box-shadow: var(--shadow-sm); }
.review-done.review-badge { background: var(--success); color: #fff; box-shadow: var(--shadow-sm); }

.review-dropdown { position: relative; display: inline-flex; }

.review-dropdown-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  padding: 0;
  border: none;
  border-radius: var(--radius-pill);
  background: rgba(255,255,255,.3);
  color: inherit;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}
.review-dropdown-toggle:hover { background: rgba(255,255,255,.5); }

.review-dropdown-menu {
  display: none;
  position: absolute;
  top: 26px;
  right: 0;
  z-index: 20;
  min-width: 170px;
  padding: 6px;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}
.review-dropdown-menu.open { display: block; }

.review-dropdown-item {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: none;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}
.review-dropdown-item:hover { background: var(--surface-3); }

/* Generic action dropdown (print menus, etc.) */
.menu-dropdown { position: relative; display: inline-flex; }

.menu-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 30;
  min-width: 180px;
  padding: 6px;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}
.menu-dropdown-menu.open { display: block; }

.menu-dropdown-item {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: none;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}
.menu-dropdown-item:hover { background: var(--surface-3); }

/* Submission counter badge on the card button */
.submit-update-wrap { position: relative; display: inline-flex; }

.submission-badge {
  position: absolute;
  top: -9px;
  right: -9px;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
  background: var(--secondary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 20px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

@keyframes submission-flash {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--secondary) 55%, transparent); }
  50% { transform: scale(1.28); box-shadow: 0 0 0 10px color-mix(in srgb, var(--secondary) 0%, transparent); }
}

.submission-badge.flash { animation: submission-flash 1.2s ease-in-out infinite; }

/* ---------------------------------- Analytics ---------------------------------- */
.analytics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.analytics-card {
  display: grid;
  gap: 6px;
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
}

.analytics-card h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.analytics-card p { margin: 0; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.analytics-card .trend-up { color: #2e7d32; }
.analytics-card .trend-down { color: #c62828; }
.analytics-card .trend-flat { color: var(--muted); }

.analytics-report { display: grid; gap: var(--sp-2); }
.analytics-report .card { padding: var(--sp-3); }
.analytics-report ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.analytics-report li::marker { color: var(--secondary); }

/* ---------------------------------- Tables ---------------------------------- */
.table-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  overflow: hidden;
}

.table-scroll {
  overflow: auto;
  max-height: 62vh;
}

.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}

.data-table th, .data-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
  white-space: normal;
}

.data-table thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  border-bottom: 1px solid var(--border-strong);
}

.data-table thead th.sortable { cursor: pointer; user-select: none; }
.data-table thead th.sortable:hover { color: var(--text); }
.data-table thead th[aria-sort]::after {
  content: '↕';
  margin-left: 6px;
  opacity: .5;
  font-size: 11px;
}
.data-table thead th[aria-sort="ascending"]::after { content: '↑'; opacity: 1; }
.data-table thead th[aria-sort="descending"]::after { content: '↓'; opacity: 1; }

.data-table tbody tr { transition: background var(--transition); }
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table tbody tr:last-child td { border-bottom: none; }

.data-table .details-cell { max-width: 320px; }

.data-table .audit-check-col { width: 40px; text-align: center; }
.data-table th.audit-check-col { padding-left: 6px; padding-right: 6px; }
.data-table .audit-row-check { vertical-align: middle; cursor: pointer; }

.table-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-1);
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: var(--fs-caption);
}

.data-table th { position: relative; }

/* ---------------------------------- Report preview ---------------------------------- */
.report-actions { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-bottom: var(--sp-2); }

.report-preview {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  padding: var(--sp-2);
}

.report-preview h3 { margin: 0 0 var(--sp-1); }

.report-preview-scroll { max-height: min(70vh, 640px); overflow: auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
.report-preview-scroll .data-table { min-width: 720px; }

/* ---------------------------------- Pagination ---------------------------------- */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  margin-top: var(--sp-2);
  flex-wrap: wrap;
}

.page-btn {
  min-width: 36px;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.page-btn:hover:not([disabled]) { background: var(--surface-3); }
.page-btn.active { background: var(--secondary); border-color: var(--secondary); color: #fff; }
.page-btn[disabled] { opacity: .45; cursor: not-allowed; }
.page-info { font-size: var(--fs-caption); color: var(--muted); font-weight: 600; }

/* ---------------------------------- Filters ---------------------------------- */
.filters-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
  flex-wrap: wrap;
}

.filters-controls { display: flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap; }

.filters-controls .select { width: auto; min-width: 180px; }

.filter-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 28px; }

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: var(--radius-pill);
  background: var(--secondary-soft);
  color: var(--secondary);
  font-size: 12px;
  font-weight: 600;
}

.filter-chip button {
  display: inline-flex;
  border: none;
  background: transparent;
  color: inherit;
  cursor: pointer;
  padding: 0;
  line-height: 1;
  opacity: .7;
}
.filter-chip button:hover { opacity: 1; }

/* ---------------------------------- Modals ---------------------------------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-2);
  background: var(--overlay);
  backdrop-filter: blur(2px);
  animation: fade-in var(--transition);
}

.modal-card {
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-3);
  box-shadow: var(--shadow-lg);
  animation: slide-up var(--transition);
}

.modal-card-sm { max-width: 420px; }

/* In-page link/document preview (embedded iframe instead of a new tab) */
.modal-card-lg { max-width: 1080px; }
.preview-note { color: var(--muted); font-size: var(--fs-caption); margin: 0 0 var(--sp-2); }
.preview-stage {
  width: 100%;
  height: 72vh;
  min-height: 360px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #fff;
}
.preview-frame {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  transform-origin: top left;
}
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-right: 8px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface, #fff);
}
.zoom-value {
  min-width: 44px;
  text-align: center;
  font-size: var(--fs-caption);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-1);
  margin-bottom: var(--sp-2);
}
.modal-header h3 { margin: 0; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* About dialog */
.about-body { display: grid; justify-items: center; gap: var(--sp-1); text-align: center; }
.about-mark { width: 56px; height: 56px; font-size: 24px; margin-bottom: var(--sp-1); }
.about-title { font-size: 18px; font-weight: 800; }
.about-subtitle { color: var(--muted); font-size: 13px; max-width: 300px; }
.about-rows { display: grid; gap: 6px; width: 100%; margin-top: var(--sp-1); }
.about-row { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface-2); font-size: 13px; }
.about-note { color: var(--muted); font-size: var(--fs-caption); margin: var(--sp-1) 0 0; }

/* ---------------------------------- Dashboard table view (S7) ---------------------------------- */
.view-toggle { display: inline-flex; gap: 4px; }
.view-toggle .btn.active { background: var(--secondary); border-color: var(--secondary); color: #fff; }
.data-table tbody tr.row-clickable { cursor: pointer; }
.data-table tbody tr.row-flagged { background: var(--warning-soft); }
.data-table tbody tr.row-flagged:hover { background: color-mix(in srgb, var(--warning-soft) 72%, var(--surface-2)); }
.data-table tbody tr.row-reset-requested { background: var(--warning-soft); box-shadow: inset 3px 0 0 var(--warning); }
.data-table tbody tr.row-reset-requested:hover { background: color-mix(in srgb, var(--warning-soft) 72%, var(--surface-2)); }
.data-table .dash-actions-col { width: 240px; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
body.modal-open { overflow: hidden; }

/* ---------------------------------- Record detail dialog (S8) ---------------------------------- */
.detail-status { display: flex; align-items: center; gap: var(--sp-1); margin-bottom: var(--sp-2); }
.detail-row { align-items: flex-start; gap: var(--sp-2); }
.detail-label { font-weight: 600; color: var(--muted); flex-shrink: 0; }
.detail-value { text-align: right; color: var(--text); word-break: break-word; }

/* ---------------------------------- Confirm dialog (S4) ---------------------------------- */
.confirm-message { color: var(--text); margin: 0 0 var(--sp-2); font-size: 14px; }

/* ---------------------------------- Audit pager (S11) ---------------------------------- */
.audit-pager { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }

/* ---------------------------------- Settings ---------------------------------- */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: var(--sp-2);
}

.settings-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  padding: var(--sp-3);
}

.settings-card-head { margin-bottom: var(--sp-2); }
.settings-card-head h3 { margin: 0 0 4px; }
.settings-card-head .section-copy { margin: 0; }

.form-inline {
  grid-template-columns: 1.4fr 1fr 1.4fr;
  gap: var(--sp-2);
  align-items: end;
}
.field-row { align-items: end; }

.settings-card-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
  flex-wrap: wrap;
}

.activity-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.activity-stat {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-raised);
  padding: var(--sp-3);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.activity-stat-value {
  font-size: var(--fs-2xl);
  font-weight: 700;
  line-height: 1;
  color: var(--text);
}

.activity-stat-label {
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.activity-subheading { margin-top: var(--sp-4); }

.activity-recent {
  list-style: none;
  margin: var(--sp-2) 0 0;
  padding: 0;
  display: grid;
  gap: var(--sp-1);
}

.activity-recent-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: var(--fs-sm);
  overflow-wrap: anywhere;
}

.activity-recent-time {
  margin-left: auto;
  color: var(--text-muted);
  white-space: nowrap;
  font-size: var(--fs-xs);
}

/* ---------------------------------- Command Palette ---------------------------------- */
.command-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; cursor: pointer; transition: background var(--transition); }
.command-item:hover { background: var(--surface-3); }
.command-shortcut { font-size: 11px; color: var(--muted); background: var(--surface-3); padding: 2px 6px; border-radius: var(--radius-xs); }

/* ---------------------------------- Documents ---------------------------------- */
.detail-docs { margin-top: var(--sp-3); border-top: 1px solid var(--border); padding-top: var(--sp-2); }
.detail-docs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-1); }
.detail-docs-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.detail-doc-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: var(--radius-xs); background: var(--surface-3); }
.detail-doc-item a { color: var(--secondary); text-decoration: none; font-size: 13px; font-weight: 600; }
.detail-doc-item a:hover { text-decoration: underline; }

/* ---------------------------------- Accessibility ---------------------------------- */
.skip-link { position: absolute; top: -40px; left: 0; background: var(--secondary); color: #fff; padding: 8px 16px; z-index: 100; transition: top 0.2s; }
.skip-link:focus { top: 0; }

/* ---------------------------------- Submissions ---------------------------------- */
.submissions-compose { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-2); }

.submissions-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-1);
  flex-wrap: wrap;
  margin-bottom: var(--sp-1);
}

.submissions-list { display: grid; gap: var(--sp-1); max-height: 45vh; overflow-y: auto; padding-right: 4px; }

.submission-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--sp-2);
  background: var(--surface-2);
  display: grid;
  gap: var(--sp-1);
}

.submission-meta {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: var(--fs-caption);
  color: var(--muted);
}

.submission-text { font-size: 13px; line-height: var(--lh-normal); }
.submission-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.submission-note { font-size: var(--fs-caption); color: var(--muted); width: 100%; }

.badge-locked { background: var(--warning-soft); color: var(--warning); }
.badge-displayed { background: var(--info-soft); color: var(--info); }

.submission-display { background: var(--secondary-soft); border: 1px solid color-mix(in srgb, var(--secondary) 22%, transparent); }

.submission-display-label {
  text-transform: none;
  font-size: var(--fs-caption);
  color: var(--secondary);
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.submission-display-time { font-size: 11px; font-weight: 500; color: var(--muted); }

/* ---------------------------------- Toasts ---------------------------------- */
.toast-container {
  position: fixed;
  bottom: max(var(--sp-2), env(safe-area-inset-bottom, 0px));
  right: max(var(--sp-2), env(safe-area-inset-right, 0px));
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-1);
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-width: 260px;
  max-width: 380px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--muted);
  box-shadow: var(--shadow-lg);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  animation: toast-in var(--transition);
  pointer-events: auto;
}

.toast.out { animation: toast-out 300ms ease forwards; }

.toast svg { flex: 0 0 auto; margin-top: 1px; }
.toast-success { border-left-color: var(--success); } .toast-success svg { color: var(--success); }
.toast-warning { border-left-color: var(--warning); } .toast-warning svg { color: var(--warning); }
.toast-error { border-left-color: var(--danger); } .toast-error svg { color: var(--danger); }
.toast-info { border-left-color: var(--info); } .toast-info svg { color: var(--info); }

@keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toast-out { to { opacity: 0; transform: translateX(16px); } }

/* ---------------------------------- Tooltips ---------------------------------- */
[data-tip] { position: relative; }

[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  padding: 5px 10px;
  border-radius: var(--radius-xs);
  background: var(--text-strong);
  color: var(--surface);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transition), visibility var(--transition);
  pointer-events: none;
}

[data-tip]:hover::after,
[data-tip]:focus-visible::after { opacity: 1; visibility: visible; }

/* ---------------------------------- Empty / error states ---------------------------------- */
.empty-state {
  display: grid;
  justify-items: center;
  gap: var(--sp-1);
  padding: var(--sp-5) var(--sp-2);
  text-align: center;
  color: var(--muted);
}

.empty-state-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-lg);
  background: var(--surface-3);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--sp-1);
}

.empty-state-title { font-size: var(--fs-subheading); font-weight: 700; color: var(--text); }
.empty-state-subtitle { font-size: 13px; max-width: 380px; }

/* ---------------------------------- Splash ---------------------------------- */
.splash {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  transition: opacity .3s ease, visibility .3s ease;
}

.splash.hide { opacity: 0; visibility: hidden; }

.splash-inner { display: grid; justify-items: center; gap: var(--sp-1); text-align: center; }

.splash-mark {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-lg);
  background: #fff;
  color: #fff;
  font-size: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg);
  margin-bottom: var(--sp-1);
  overflow: hidden;
}

.splash-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }

.splash-title { font-size: 20px; font-weight: 800; color: var(--text-strong); }
.splash-caption { font-size: 13px; color: var(--muted); }

.splash-loader { display: flex; gap: 6px; margin-top: var(--sp-2); }
.splash-loader span {
  width: 8px; height: 8px;
  border-radius: var(--radius-pill);
  background: var(--secondary);
  animation: bounce 1s ease-in-out infinite;
}
.splash-loader span:nth-child(2) { animation-delay: .15s; background: var(--primary); }
.splash-loader span:nth-child(3) { animation-delay: .3s; background: var(--warning); }

@keyframes bounce { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-6px); opacity: 1; } }

/* ---------------------------------- Overlay ---------------------------------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 1800;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  background: var(--overlay);
  color: #fff;
  animation: fade-in var(--transition);
}

.spinner {
  width: 44px;
  height: 44px;
  border: 4px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------------------------- Auth screens ---------------------------------- */
.auth-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-2);
  background: linear-gradient(160deg, var(--bg) 0%, var(--surface-3) 100%);
}

.auth-card {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-lg);
  animation: slide-up var(--transition);
}

.auth-brand { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.auth-mark { width: 48px; height: 48px; }
.auth-name { font-size: 18px; }
.auth-subtitle { color: var(--muted); font-size: 13px; }

.auth-links { display: flex; justify-content: center; gap: var(--sp-1); margin-top: var(--sp-2); flex-wrap: wrap; }

/* ---------------------------------- Mobile sidebar backdrop ---------------------------------- */
/* Fixed so it is removed from the app-shell grid and never becomes a grid item. */
.sidebar-backdrop {
  position: fixed;
  inset: 0;
  z-index: 35;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
