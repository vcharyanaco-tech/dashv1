<style>
:root {
  color-scheme: light;
  --bg: #f8f6f2;
  --surface: #ffffff;
  --surface-strong: #fdfdfd;
  --primary: #da291c;
  --primary-soft: #fff0f0;
  --accent: #004b87;
  --text: #1d1d1d;
  --muted: #5f6368;
  --border: #ded9d2;
  --header: #da291c;
  --header-text: #ffffff;
  --card-radius: 18px;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f8f6f2 0%, #efebe7 100%);
  color: var(--text);
}

body.dark-mode {
  color-scheme: dark;
  --bg: #121212;
  --surface: #1d1f21;
  --surface-strong: #26292c;
  --primary-soft: rgba(218,41,28,.12);
  --text: #f1f3f5;
  --muted: #b5b8bd;
  --border: #2f3236;
  background: #0d0f12;
}

button, input, select, textarea {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
}

.app-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px 24px;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid rgba(0,0,0,.06);
  margin-top: 24px;
}

.app-header {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  background: var(--header);
  color: var(--header-text);
  flex-wrap: wrap;
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: #ffffff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--header);
  font-size: 26px;
  box-shadow: 0 18px 40px rgba(0,0,0,.12);
  overflow: hidden;
  padding: 6px;
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.brand-mark-fallback {
  display: none;
  font-size: 28px;
  line-height: 1;
}

.brand-name {
  font-size: 22px;
  font-weight: 700;
}

.brand-subtitle {
  color: rgba(255,255,255,.9);
  font-size: 14px;
}

.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.user-chip {
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,.18);
  color: #fff;
  font-size: 14px;
}

.app-nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.nav-item {
  flex: 1 1 auto;
  min-width: 120px;
  padding: 12px 16px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  transition: .2s;
  cursor: pointer;
}

.nav-item.active,
.nav-item:hover {
  background: var(--primary-soft);
  border-color: rgba(218,41,28,.18);
}

.main-content {
  padding: 24px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.section-header h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.section-copy {
  margin: 0;
  color: var(--muted);
}

.section-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.filters-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.filters-row input,
.filters-row select,
.settings-form input {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  padding: 14px 16px;
  transition: border-color .2s, box-shadow .2s;
}

.filters-row input:focus,
.filters-row select:focus,
.settings-form input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(218,41,28,.08);
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 18px;
}

.card,
.analytics-card,
.report-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--card-radius);
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.05);
}

.card {
  display: grid;
  gap: 12px;
}

.card-fields {
  display: grid;
  gap: 10px;
}

.card-field {
  display: grid;
  gap: 4px;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(0,0,0,.03);
}

.field-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--muted);
}

.field-value {
  color: var(--text);
  line-height: 1.5;
}

.card h3 {
  margin: 0;
  font-size: 18px;
}

.card .card-meta {
  display: grid;
  gap: 8px;
  color: var(--muted);
}

.preserve-whitespace {
  white-space: pre-wrap;
  word-break: break-word;
}

.card .actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  border: none;
  cursor: pointer;
  border-radius: 999px;
  padding: 12px 18px;
  font-weight: 600;
  transition: transform .2s, background .2s, color .2s;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-secondary {
  background: rgba(0,0,0,.06);
  color: var(--text);
}

.btn-danger {
  background: #d32f2f;
  color: #fff;
}

.hidden { display:none !important; }

.message-panel {
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 18px;
  background: #fff4e5;
  border: 1px solid #ffd8a8;
  color: #663c00;
}

.audit-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface);
}

.audit-table th,
.audit-table td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  color: var(--text);
}

.audit-table th {
  font-weight: 700;
}

.table-wrapper {
  overflow-x:auto;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.06);
}

.report-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
}

.report-preview-scroll {
  max-height: min(70vh, 640px);
  overflow-y: auto;
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid var(--border);
}

.report-preview-scroll .audit-table {
  min-width: 720px;
}

.settings-form {
  display: grid;
  gap: 14px;
  max-width: 520px;
}

.settings-form label {
  display: grid;
  gap: 8px;
  color: var(--text);
  font-weight: 600;
}

.settings-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.settings-status {
  color: var(--muted);
}

@media (max-width: 1024px) {
  .cards-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 760px) {
  .app-header, .section-header { flex-direction: column; align-items: stretch; }
  .filters-row { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
  .nav-item { flex: 1 1 100%; }
}

</style>
