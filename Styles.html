<style>

/* ==========================================================
   Global
========================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        "Google Sans",
        Roboto,
        Arial,
        sans-serif;

    background:#f5f7fa;

    color:#222;

    font-size:14px;

    line-height:1.5;

}



/* ==========================================================
   Header
========================================================== */

.header{

    background:#1F3864;

    color:#fff;

    padding:24px 40px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:20px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);

}

.header h1{

    font-size:28px;

    font-weight:600;

    margin-bottom:6px;

}

.subtitle{

    opacity:.9;

    font-size:13px;

}

.header-right{

    display:flex;

    align-items:center;

}



/* ==========================================================
   Toolbar
========================================================== */

.toolbar{

    background:#fff;

    padding:18px 40px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

    border-bottom:1px solid #e3e3e3;

}

.toolbar input,

.toolbar select{

    flex:1;

    min-width:220px;

    padding:10px 14px;

    border:1px solid #d6d6d6;

    border-radius:6px;

    font-size:14px;

    outline:none;

    transition:.2s;

}

.toolbar input:focus,

.toolbar select:focus{

    border-color:#1F3864;

    box-shadow:0 0 0 3px rgba(31,56,100,.15);

}



/* ==========================================================
   Buttons
========================================================== */

.btn{

    cursor:pointer;

    border:none;

    border-radius:6px;

    padding:10px 18px;

    font-weight:600;

    transition:.2s;

}

.btn:hover{

    transform:translateY(-1px);

}

.btn-primary{

    background:#1F3864;

    color:white;

}

.btn-save{

    background:#2E7D32;

    color:#fff;

}

.btn-edit{

    background:#1565C0;

    color:#fff;

}

.btn-cancel{

    background:#9E9E9E;

    color:#fff;

}

.btn-del{

    background:#D32F2F;

    color:#fff;

}

.btn-del.confirming{

    background:#8B0000;

}



/* ==========================================================
   Cards
========================================================== */

.cards{

    padding:24px 40px;

}

.card{

    background:#fff;

    border-radius:10px;

    border:1px solid #e4e4e4;

    padding:18px;

    margin-bottom:18px;

    transition:.2s;

    box-shadow:0 2px 4px rgba(0,0,0,.05);

}

.card:hover{

    box-shadow:0 8px 20px rgba(0,0,0,.10);

}

.card.flag{

    border-left:5px solid #ffab00;

    background:#fffdf7;

}



/* ==========================================================
   Card Header
========================================================== */

.chead{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;

}

.badge{

    background:#1F3864;

    color:#fff;

    padding:5px 12px;

    border-radius:5px;

    font-size:12px;

    font-weight:600;

}

.badge.flag{

    background:#ffab00;

    color:#222;

}

.due{

    background:#ffab00;

    color:#222;

    padding:5px 12px;

    border-radius:5px;

    font-weight:600;

}



/* ==========================================================
   Fields
========================================================== */

.f{

    margin-bottom:12px;

}

.f label{

    display:block;

    margin-bottom:4px;

    font-size:11px;

    color:#777;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.4px;

}

.v{

    font-size:14px;

}

.v.act{

    white-space:pre-wrap;

    line-height:1.6;

}

.v.rev{

    color:#C62828;

    font-weight:bold;

}



/* ==========================================================
   Form Controls
========================================================== */

.f input,

.f textarea{

    width:100%;

    border:1px solid #ddd;

    border-radius:5px;

    padding:9px 10px;

    font-family:inherit;

    font-size:14px;

}

.f textarea{

    resize:vertical;

}



/* ==========================================================
   Actions
========================================================== */

.acts{

    margin-top:16px;

    padding-top:14px;

    border-top:1px solid #eee;

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}



/* ==========================================================
   Loading
========================================================== */

.loading{

    text-align:center;

    padding:40px;

    color:#777;

}



/* ==========================================================
   Overlay
========================================================== */

.overlay{

    position:fixed;

    inset:0;

    background:rgba(255,255,255,.75);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.hidden{

    display:none;

}

.spinner{

    width:50px;

    height:50px;

    border:5px solid #ddd;

    border-top:5px solid #1F3864;

    border-radius:50%;

    animation:spin 1s linear infinite;

}

.overlay-text{

    margin-top:14px;

    font-size:14px;

    font-weight:600;

}



/* ==========================================================
   Toast
========================================================== */

.toast{

    position:fixed;

    bottom:30px;

    right:30px;

    min-width:240px;

    padding:14px 18px;

    background:#1F3864;

    color:white;

    border-radius:6px;

    box-shadow:0 8px 18px rgba(0,0,0,.2);

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:99999;

}

.toast.show{

    opacity:1;

}



/* ==========================================================
   Footer
========================================================== */

.footer{

    padding:18px;

    text-align:center;

    color:#777;

    font-size:12px;

}



/* ==========================================================
   Animation
========================================================== */

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}



/* ==========================================================
   Responsive
========================================================== */

@media(max-width:768px){

.header{

    padding:18px;

}

.toolbar{

    padding:18px;

}

.cards{

    padding:18px;

}

.header{

    flex-direction:column;

    align-items:flex-start;

}

.header-right{

    width:100%;

}

.btn-primary{

    width:100%;

}

.acts{

    flex-direction:column;

}

.acts button{

    width:100%;

}

}

</style>
